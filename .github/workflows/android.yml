name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build development APK
        env:
          KANBAN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kanban-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not configured. Only debug APK will be built."
          fi

      - name: Decode release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kanban-release.jks"

      - name: Build permanently signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KANBAN_KEYSTORE_PATH: ${{ runner.temp }}/kanban-release.jks
          KANBAN_STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KANBAN_KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KANBAN_KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
          KANBAN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kanban-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kanban-release.jks"
