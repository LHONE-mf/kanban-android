appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# The host runner has verified the exported JSON bytes, then cleared ONLY the
# disposable CI emulator's app data. Restore from the SAF Downloads document.
- launchApp:
    clearState: false
# Import is in the compact overflow menu on narrow Android screens.
- tapOn: "⋮"
- extendedWaitUntil:
    visible:
      id: "importBtn"
    timeout: 30000
- assertNotVisible:
    id: "Beta persistence smoke task"
- tapOn:
    id: "importBtn"
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- takeScreenshot: ui-screenshots/kanban-backup-import-picker
- tapOn: "Show roots"
- tapOn: "(?i)^Downloads$"
- extendedWaitUntil:
    visible: "kanban-backup-\\d{4}-\\d{2}-\\d{2}\\.json"
    timeout: 30000
- tapOn: "kanban-backup-\\d{4}-\\d{2}-\\d{2}\\.json"
- extendedWaitUntil:
    visible:
      id: "confirmOk"
    timeout: 30000
- assertVisible: "Импорт данных"
- takeScreenshot: ui-screenshots/kanban-backup-restore-confirm
- tapOn:
    id: "confirmOk"
- scrollUntilVisible:
    element:
      id: "Beta upgrade persistence task"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Beta upgrade persistence task"
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Beta persistence smoke task"
- takeScreenshot: ui-screenshots/kanban-backup-restored
# Confirm imported tasks themselves have been written to IndexedDB.
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: "Beta upgrade persistence task"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Beta upgrade persistence task"
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Beta persistence smoke task"
- takeScreenshot: ui-screenshots/kanban-backup-restored-after-restart
