appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# The runner imported a disposable JSON fixture with a real text attachment.
# Tapping Open must reach Android's native ACTION_VIEW chooser, not a WebView
# blob download (which silently failed on physical Android devices).
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "importBtn"
    timeout: 30000
- tapOn:
    id: "importBtn"
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- tapOn: "Show roots"
- tapOn: "(?i)^Downloads$"
- extendedWaitUntil:
    visible: "kanban-attachment-ci.json"
    timeout: 30000
- tapOn: "kanban-attachment-ci.json"
- extendedWaitUntil:
    visible:
      id: "confirmOk"
    timeout: 30000
- tapOn:
    id: "confirmOk"
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Beta persistence smoke task"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
- hideKeyboard
# Maestro's WebView hierarchy reports clipped elements as visible. Its
# scrollUntilVisible can therefore return without scrolling the inner modal,
# then tap below the viewport (on the Android Home navigation area).
# Swipe within the modal's scrollable content, never its sticky footer.
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
# aria-label is exposed as accessibility *text* in the WebView hierarchy,
# not as Android resource-id. Target the exact name to avoid other buttons.
- assertVisible: "Открыть файл kanban-view-test.txt"
- takeScreenshot: ui-screenshots/android-attachment-before-open
- tapOn: "Открыть файл kanban-view-test.txt"
# Headless emulator images may have no installed text/plain viewer, and the
# Android resolver can exit to the launcher without a chooser label.
# The runner checks native ACTION_VIEW dispatch in Android logcat instead.
- takeScreenshot: ui-screenshots/android-attachment-after-open
