appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Create a Kanban task while APK versionCode 1 is installed.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 30000
- tapOn:
    id: "quickAdd"
- inputText: "Beta upgrade persistence task"
# Use the explicit mobile button; keyboard Enter is not consistently emitted by the emulator.
- tapOn:
    id: "quickAddSubmit"
- scrollUntilVisible:
    element:
      id: "Beta upgrade persistence task"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Beta upgrade persistence task"
- takeScreenshot: ui-screenshots/kanban-before-upgrade
