name: Android UI Smoke Tests and Screenshots

# Run manually when investigating layout, themes, or system-bar issues.
# Emulator boot is significantly slower than normal CI checks.
on:
  workflow_dispatch:
  push:
    branches:
      - ui-testing

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable development signing key
        run: |
          base64 --decode .github/keys/kanban-debug.keystore.b64 > .github/keys/kanban-debug.keystore
          chmod 600 .github/keys/kanban-debug.keystore
          keytool -list -keystore .github/keys/kanban-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Verify source and compile APK
        env:
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
          KANBAN_VERSION_CODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_japanese_storage.cjs
          node tests/test_japanese_review.cjs
          python3 tools/build_kanban_js.py --check
          gradle :app:assembleDebug --no-daemon
      - name: Build sequentially versioned APKs for upgrade regression
        env:
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: |
          set -euo pipefail
          mkdir -p ui-apks
          cp app/build/outputs/apk/debug/app-debug.apk ui-apks/kanban-v1.apk
          KANBAN_VERSION_CODE=2 gradle :app:assembleDebug --no-daemon --rerun-tasks
          cp app/build/outputs/apk/debug/app-debug.apk ui-apks/kanban-v2.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ui-apks/kanban-v1.apk | grep -q "versionCode='1'"
          "$AAPT" dump badging ui-apks/kanban-v2.apk | grep -q "versionCode='2'"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in ui-apks/kanban-v1.apk ui-apks/kanban-v2.apk; do
            "$APKSIGNER" verify "$apk"
          done
          CERT1=$("$APKSIGNER" verify --print-certs ui-apks/kanban-v1.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          CERT2=$("$APKSIGNER" verify --print-certs ui-apks/kanban-v2.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$CERT1" && test "$CERT1" = "$CERT2"
      - name: Install Maestro UI test runner
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh; then
              bash /tmp/install-maestro.sh
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maestro installer download failed after retries"
              exit 1
            fi
            sleep 5
          done
          test -x "$HOME/.maestro/bin/maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM acceleration for Android UI tests
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo "KVM accelerator accessible to GitHub Actions runner."
          else
            echo "::warning::KVM unavailable; emulator UI tests may time out."
          fi
      - name: Run Android UI interactions and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p ui-screenshots
            stage="emulator setup"
            capture_failure() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "::error::Android UI regression failed (exit $status) during: $stage"
                echo "### Android UI regression failed: $stage" >> "$GITHUB_STEP_SUMMARY"
                printf "Failed stage: %s\\nExit code: %s\\n" "$stage" "$status" > ui-screenshots/failure-stage.txt
                echo "Check the android-ui-screenshots artifact for Maestro diagnostics, screenshot, package info, and logcat." >> "$GITHUB_STEP_SUMMARY"
                adb exec-out screencap -p > ui-screenshots/emulator-on-failure.png || true
                adb logcat -d -t 1500 > ui-screenshots/emulator-logcat-on-failure.txt || true
                adb shell dumpsys package com.kanban.offline > ui-screenshots/package-on-failure.txt || true
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml ui-screenshots/window-on-failure.xml >/dev/null 2>&1 || true
              else
                echo "### Android UI regression passed" >> "$GITHUB_STEP_SUMMARY"
                echo "Smoke, Japanese restart, Kanban v1 creation, Japanese v2 upgrade, and Kanban persistence flows completed." >> "$GITHUB_STEP_SUMMARY"
              fi
            }
            trap capture_failure EXIT
            stage="install APK v1"
            adb install -r ui-apks/kanban-v1.apk
            stage="navigation smoke"
            "$HOME/.maestro/bin/maestro" test .maestro/smoke.yaml --debug-output ui-screenshots/maestro-debug
            stage="Japanese restart persistence"
            "$HOME/.maestro/bin/maestro" test .maestro/japanese-progress.yaml --debug-output ui-screenshots/japanese-progress-debug
            stage="Kanban task creation on v1"
            "$HOME/.maestro/bin/maestro" test .maestro/kanban-before-upgrade.yaml --debug-output ui-screenshots/kanban-before-upgrade-debug
            stage="upgrade to APK v2"
            adb install -r ui-apks/kanban-v2.apk
            stage="Japanese progress after upgrade"
            "$HOME/.maestro/bin/maestro" test .maestro/japanese-upgrade.yaml --debug-output ui-screenshots/japanese-upgrade-debug
            stage="Kanban persistence after upgrade"
            "$HOME/.maestro/bin/maestro" test .maestro/kanban-persistence.yaml --debug-output ui-screenshots/kanban-persistence-debug
            adb exec-out screencap -p > ui-screenshots/kanban-after-removal.png
            test -s ui-screenshots/kanban-after-removal.png
      - name: Upload screenshots and Maestro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
          include-hidden-files: true
      - name: Remove development signing key
        if: always()
        run: rm -f .github/keys/kanban-debug.keystore
