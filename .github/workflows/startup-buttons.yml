name: Android Startup Button Smoke

# Catch dead UI controls on actual Android WebView, without running the
# long recurrence/backup/photo suites on every ordinary source change.
on:
  workflow_dispatch:
  push:
    branches: [ui-testing]
    paths:
      - 'app/src/main/assets/kanban.html'
      - 'app/src/main/assets/kanban.js'
      - 'app/src/main/assets/kanban.css'
      - 'app/src/main/js-src/**'
      - 'app/src/main/java/com/kanban/offline/**'
      - 'app/build.gradle.kts'
      - '.maestro/startup-buttons.yaml'
      - '.github/scripts/run-startup-buttons-ui.sh'
      - '.github/workflows/startup-buttons.yml'

permissions:
  contents: read

concurrency:
  group: android-startup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable development signing key
        run: |
          base64 --decode .github/keys/kanban-debug.keystore.b64 > .github/keys/kanban-debug.keystore
          chmod 600 .github/keys/kanban-debug.keystore
      - name: Build and verify app for smoke test
        env:
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: |
          python3 tools/build_kanban_js.py --check
          node tests/test_global_search.cjs
          node --check app/src/main/assets/kanban.js
          bash -n .github/scripts/run-startup-buttons-ui.sh
          gradle :app:assembleDebug --no-daemon
      - name: Install Maestro
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh; then
              bash /tmp/install-maestro.sh
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 4
          done
          test -x "$HOME/.maestro/bin/maestro"
      - name: Enable KVM acceleration
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Check real Android startup, buttons, search and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/run-startup-buttons-ui.sh
      - name: Upload startup screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-button-smoke
          path: ui-screenshots/
          if-no-files-found: warn
          include-hidden-files: true
      - name: Remove signing key
        if: always()
        run: rm -f .github/keys/kanban-debug.keystore
