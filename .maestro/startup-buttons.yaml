appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Disposable emulator only. Prove that the *real buttons* perform actions.
# A successful APK build or visible WebView alone cannot detect dead controls.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 30000
- assertVisible:
    id: "addBoardBtn"
- assertVisible:
    id: "globalSearchTab"
- takeScreenshot: ui-screenshots/startup-initial

# Board creation button must open a usable dialog (cancel without changing data).
- tapOn:
    id: "addBoardBtn"
- extendedWaitUntil:
    visible:
      id: "textPromptInput"
    timeout: 15000
- tapOn:
    id: "textPromptCancel"
- assertNotVisible:
    id: "textPromptInput"

# All navigation tabs must execute their real view switches. A dead startup
# handler can leave tabs visible while their content never becomes active.
- tapOn:
    id: "dashboardTab"
- extendedWaitUntil:
    visible: "Общий прогресс"
    timeout: 15000
- tapOn:
    id: "mindmapTab"
- extendedWaitUntil:
    visible:
      id: "mindmap"
    timeout: 15000
# Calendar is clipped on narrow screens, so scroll the tab strip horizontally
# instead of trusting an offscreen WebView accessibility element.
- swipe:
    start: 85%, 14%
    end: 15%, 14%
    duration: 450
- assertVisible:
    id: "calendarTab"
- tapOn:
    id: "calendarTab"
- extendedWaitUntil:
    visible:
      id: "calPrev"
    timeout: 15000
- swipe:
    start: 15%, 14%
    end: 85%, 14%
    duration: 450
- assertVisible:
    id: "kanbanTab"
- takeScreenshot: ui-screenshots/nav-before-kanban-return
# WebView's accessibility tap coordinates can lag behind a horizontal swipe.
# Use the visually verified first-tab position on our fixed Pixel 6 emulator.
# The quickAdd assertion below proves that this tap really switched views.
- tapOn:
    point: "12%, 14%"
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 15000
- takeScreenshot: ui-screenshots/startup-navigation-roundtrip

# Create a task via the actual app UI, then open/close its editor.
- tapOn:
    id: "quickAdd"
- inputText: "CI startup button smoke"
- tapOn:
    id: "quickAddSubmit"
- scrollUntilVisible:
    element:
      id: "CI startup button smoke"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "CI startup button smoke"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 15000
- hideKeyboard
- pressKey: Back
- assertNotVisible: "Редактирование задачи"
- takeScreenshot: ui-screenshots/startup-task-created

# Search button must open a working view and find the stored task.
- tapOn:
    id: "globalSearchTab"
- extendedWaitUntil:
    visible:
      id: "globalSearchInput"
    timeout: 15000
- tapOn:
    id: "globalSearchInput"
- inputText: "startup button smoke"
- hideKeyboard
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI startup button smoke, доска Моя доска$'
- takeScreenshot: ui-screenshots/startup-search-works

# A restart must reattach handlers and preserve the task in IndexedDB.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "globalSearchTab"
    timeout: 30000
- tapOn:
    id: "globalSearchTab"
- extendedWaitUntil:
    visible:
      id: "globalSearchInput"
    timeout: 15000
- tapOn:
    id: "globalSearchInput"
- inputText: "startup button smoke"
- hideKeyboard
- assertVisible: "Найдено задач: 1"
- takeScreenshot: ui-screenshots/startup-after-restart
