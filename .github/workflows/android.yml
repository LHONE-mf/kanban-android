name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: 'Publish standalone Comrade APK to Releases (requires separate approval)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore stable development signing key
        run: |
          base64 --decode .github/keys/kanban-debug.keystore.b64 > .github/keys/kanban-debug.keystore
          chmod 600 .github/keys/kanban-debug.keystore
          keytool -list -keystore .github/keys/kanban-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Run project regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify generated Kanban JavaScript
        run: python3 tools/build_kanban_js.py --check
      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/kanban.js
      - name: Verify removal of the AI experiment
        run: node tests/test_no_ai.js
      - name: Test task priority badges in all four states
        run: node tests/test_task_priority_badges.js
      - name: Test all-board Comrade daily planning
        run: node tests/test_daily_plan.js
      - name: Verify atomic editor save and failure handling
        run: node tests/test_task_editor_atomic.js
      - name: Check mobile attachment controls
        run: node tests/test_attachment_layout.js
      - name: Test Android Back and exact original Comrade icons
        run: node tests/test_android_back.js
      - name: Check compact mobile header menu, accessibility and Back
        run: node tests/test_mobile_header_menu.js
      - name: Test responsive mobile header, safe-area and rotation
        run: node tests/test_responsive_header.js
      - name: Test mobile navigation and dialog keyboard priority
        run: node tests/test_mobile_navigation_regression.js
      - name: Test board-scoped horizontal and vertical column scrolling
        run: node tests/test_column_scroll_state.js
      - name: Test mobile long-press drag, cancellation and safe drops
        run: node tests/test_card_drag_gestures.js
      - name: Verify backup completeness, daily plan, and Japanese progress
        run: node tests/test_backup_integrity.js
      - name: Verify native Japanese progress backup and restoration bridge
        run: node tests/test_native_japanese_transport.js
      - name: Verify Android backup chunk-transfer protocol
        run: node tests/test_backup_transport.js
      - name: Verify audio attachment write ordering
        run: node tests/test_audio_staging.js
      - name: Compile Kotlin before APK packaging
        env:
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Build development APK
        env:
          KANBAN_VERSION_CODE: ${{ github.run_number }}
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify development APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -q 'Signer #1 certificate SHA-256 digest'
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=$(keytool -list -v -keystore .github/keys/kanban-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          INFO=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "^package:")
          echo "$INFO"
          echo "$INFO" | grep -q "name='com.kanban.offline'"
          echo "$INFO" | grep -q "versionCode='${{ github.run_number }}'"
          echo "Verified package, versionCode and persistent signing certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: kanban-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are ZIP containers, which some Android file managers
      # cannot unpack. GitHub Releases publishes the original signed APK bytes.
      - name: Publish standalone Comrade APK (no ZIP)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_apk == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/Comrade.apk"
          (cd "$RUNNER_TEMP" && sha256sum Comrade.apk > Comrade.apk.sha256)
          gh release create "comrade-build-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/Comrade.apk" \
            "$RUNNER_TEMP/Comrade.apk.sha256" \
            --title "Comrade Android · сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Прямой APK для установки на Android, без ZIP-архива. Тестовая debug-сборка с постоянной подписью. Устанавливайте поверх текущего Comrade, не удаляя приложение и его данные." \
            --latest \
            --target "$GITHUB_SHA"


      - name: Check release signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not configured. Only debug APK will be built."
          fi

      - name: Decode release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kanban-release.jks"

      - name: Build permanently signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KANBAN_KEYSTORE_PATH: ${{ runner.temp }}/kanban-release.jks
          KANBAN_STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KANBAN_KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KANBAN_KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
          KANBAN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kanban-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/kanban-release.jks" .github/keys/kanban-debug.keystore
