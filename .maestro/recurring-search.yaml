appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Disposable emulator only. Exercise the actual WebView -> IndexedDB path:
# weekly task -> completion -> new occurrence -> restart -> global search.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 30000
- tapOn:
    id: "quickAdd"
- inputText: "CI weekly recurring task"
- tapOn:
    id: "quickAddSubmit"
- scrollUntilVisible:
    element:
      id: "CI weekly recurring task"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "CI weekly recurring task"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
# The emulator keeps the text keyboard open after task creation. Its WebView
# hierarchy may list offscreen controls as visible; dismiss it and scroll the
# actual editor before tapping the native select.
- hideKeyboard
- scroll
- scrollUntilVisible:
    element:
      id: "taskRepeatWeeklyBtn"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 80
    timeout: 30000
- tapOn:
    id: "taskRepeatWeeklyBtn"
# WebView can expose an off-screen button as visible. The tap must not hit
# the backdrop and dismiss the editor instead.
- assertVisible: "Редактирование задачи"
- takeScreenshot: ui-screenshots/recurring-weekly-button-selected
- scrollUntilVisible:
    element:
      id: "saveTaskBtn"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "saveTaskBtn"
- assertNotVisible: "Редактирование задачи"
# First prove that recurrence was actually saved; earlier native popup taps could
# silently leave taskRepeat="none" while still returning a successful tap.
- assertVisible: "🔁 Еженедельно"
- takeScreenshot: ui-screenshots/recurring-setting-saved
- scrollUntilVisible:
    element:
      id: "Отметить выполненной: CI weekly recurring task"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Отметить выполненной: CI weekly recurring task"
- scrollUntilVisible:
    element:
      id: '^CI weekly recurring task \(повтор\)$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^CI weekly recurring task \(повтор\)$'
- takeScreenshot: ui-screenshots/recurring-next-occurrence
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: '^CI weekly recurring task \(повтор\)$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^CI weekly recurring task \(повтор\)$'
# Search tab finds both saved occurrences and opens the fresh occurrence via its distinct accessible button.
# Capture the navigation at phone width: Search should be next to Kanban, not clipped after Calendar.
- takeScreenshot: ui-screenshots/search-tab-reachable
- tapOn:
    id: "globalSearchTab"
- extendedWaitUntil:
    visible:
      id: "globalSearchInput"
    timeout: 30000
- tapOn:
    id: "globalSearchInput"
- inputText: "weekly recurring"
- hideKeyboard
- assertVisible: "Найдено задач: 2"
# Exercise real Android dropdowns and verify that completed/unfinished
# occurrences remain distinguishable without altering the stored tasks.
- scrollUntilVisible:
    element:
      id: "globalSearchStatusFilter"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "globalSearchStatusFilter"
- tapOn: "Не завершены"
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- takeScreenshot: ui-screenshots/search-active-filter
- tapOn:
    id: "globalSearchStatusFilter"
- tapOn: "Завершены"
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
- takeScreenshot: ui-screenshots/search-done-filter
- tapOn:
    id: "globalSearchStatusFilter"
- tapOn: "Все статусы"
- assertVisible: "Найдено задач: 2"
# The board filter must also work as an interactive control on Android.
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Моя доска"
- assertVisible: "Найдено задач: 2"
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Все доски"
- assertVisible: "Найдено задач: 2"
- takeScreenshot: ui-screenshots/search-filter-reset
# The native Japanese dock covers the screen bottom; first scroll the
# matching task into the unobstructed portion of the WebView before tapping.
- scroll
- scrollUntilVisible:
    element:
      id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска'
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    timeout: 30000
- takeScreenshot: ui-screenshots/search-result-tappable
- tapOn:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска'
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
- takeScreenshot: ui-screenshots/recurring-global-search-navigation

# Task editor focuses its title; dismiss IME before Android Back.
# Otherwise Back closes the keyboard rather than saving the editor.
- hideKeyboard
# After opening an exact result, create a second, empty board through the UI.
# Selecting it must return 0 matches; switching back restores the original two.
- pressKey: Back
- assertNotVisible: "Редактирование задачи"
- tapOn:
    id: "addBoardBtn"
- extendedWaitUntil:
    visible:
      id: "textPromptInput"
    timeout: 30000
- hideKeyboard
- tapOn:
    id: "textPromptSubmit"
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 30000
- tapOn:
    id: "globalSearchTab"
- assertVisible: "Найдено задач: 2"
- scrollUntilVisible:
    element:
      id: "globalSearchBoardFilter"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Новая доска"
- assertVisible: "Найдено задач: 0"
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
- takeScreenshot: ui-screenshots/search-other-board-empty
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Моя доска"
- assertVisible: "Найдено задач: 2"
- takeScreenshot: ui-screenshots/search-original-board-restored


# High-risk data operation: move an actual persisted recurring task to the
# second board. Verify the source and destination, then restart the WebView
# to prove this was an IndexedDB move rather than a transient UI change.
- scrollUntilVisible:
    element:
      id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
- hideKeyboard
# Android WebView's visible hierarchy sometimes omits the resource-id of
# this nested button, but keeps its exact accessible text. Target what the
# person sees rather than an off-screen/stale id from the devtools tree.
- scrollUntilVisible:
    element: "Переместить"
    direction: UP
    centerElement: true
    timeout: 30000
- takeScreenshot: ui-screenshots/task-move-button-in-view
# Only one destination is available here: Новая доска. This deliberately
# avoids an unrelated native-select interaction while exercising the move.
- tapOn: "Переместить"
- assertVisible: "Редактирование задачи"
- takeScreenshot: ui-screenshots/moved-task-editor
- hideKeyboard
- pressKey: Back
- assertNotVisible: "Редактирование задачи"
- tapOn:
    id: "globalSearchTab"
- scrollUntilVisible:
    element:
      id: "globalSearchBoardFilter"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Новая доска"
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Новая доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- takeScreenshot: ui-screenshots/move-destination-search
- tapOn:
    id: "globalSearchBoardFilter"
- tapOn: "Моя доска"
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Моя доска$'
- takeScreenshot: ui-screenshots/move-source-search
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: "globalSearchTab"
- tapOn:
    id: "globalSearchInput"
- inputText: "weekly recurring"
- hideKeyboard
- assertVisible: "Найдено задач: 2"
- assertVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Новая доска$'
- assertVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- takeScreenshot: ui-screenshots/move-persists-after-restart

# Delete the destination board through the real confirmation UI. Its moved
# recurring task must disappear, while the original board survives restart.
- tapOn:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Новая доска$'
- assertVisible: "Редактирование задачи"
- hideKeyboard
- pressKey: Back
- assertNotVisible: "Редактирование задачи"
- tapOn:
    id: "mobileActionsToggle"
- tapOn:
    id: "settingsBtn"
- assertVisible: "Настройки доски"
- hideKeyboard
- tapOn:
    id: "deleteBoardBtn"
- assertVisible: "Удалить доску"
- tapOn:
    id: "confirmOk"
- assertNotVisible: "Настройки доски"
- tapOn:
    id: "globalSearchTab"
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Новая доска$'
- takeScreenshot: ui-screenshots/board-deletion-search
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: "globalSearchTab"
- tapOn:
    id: "globalSearchInput"
- inputText: "weekly recurring"
- hideKeyboard
- assertVisible: "Найдено задач: 1"
- assertVisible:
    id: '^Открыть: CI weekly recurring task, доска Моя доска$'
- assertNotVisible:
    id: '^Открыть: CI weekly recurring task \(повтор\), доска Новая доска$'
- takeScreenshot: ui-screenshots/board-deletion-persists-after-restart
