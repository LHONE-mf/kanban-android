appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# The runner imported a disposable JSON fixture with a real text attachment.
# Tapping Open must reach Android's native ACTION_VIEW chooser, not a WebView
# blob download (which silently failed on physical Android devices).
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "importBtn"
    timeout: 30000
- tapOn:
    id: "importBtn"
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- tapOn: "Show roots"
- tapOn: "(?i)^Downloads$"
- extendedWaitUntil:
    visible: "kanban-attachment-ci.json"
    timeout: 30000
- tapOn: "kanban-attachment-ci.json"
- extendedWaitUntil:
    visible:
      id: "confirmOk"
    timeout: 30000
- tapOn:
    id: "confirmOk"
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Beta persistence smoke task"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "Открыть файл kanban-view-test.txt"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "Открыть файл kanban-view-test.txt"
- takeScreenshot: ui-screenshots/android-attachment-before-open
- tapOn:
    id: "Открыть файл kanban-view-test.txt"
# Headless emulator images may have no installed text/plain viewer, and the
# Android resolver can exit to the launcher without a chooser label.
# The runner checks native ACTION_VIEW dispatch in Android logcat instead.
- takeScreenshot: ui-screenshots/android-attachment-after-open
