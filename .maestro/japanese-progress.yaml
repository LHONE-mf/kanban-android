appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Mark a kana, restart the Android activity, and verify WebView storage survives.
- launchApp:
    clearState: true
- tapOn: "日本語 · Учить"
- extendedWaitUntil:
    visible: "Изучено 0 / 92 знаков кана"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Начать с あ・い・う・え・お"
    direction: DOWN
- tapOn: "Начать с あ・い・う・え・お"
# Capture the kana grid before selecting あ, even if the selector fails.
- takeScreenshot: ui-screenshots/japanese-first-lesson-grid
- scrollUntilVisible:
    element:
      id: "Кана あ"
    direction: DOWN
- tapOn:
    id: "Кана あ"
- scrollUntilVisible:
    element:
      text: "Отметить как изученное"
    direction: DOWN
- assertVisible: "Отметить как изученное"
- tapOn: "Отметить как изученное"
- assertVisible: "✓ Изучено — снять отметку"
- scrollUntilVisible:
    element:
      text: "Изучено 1 / 92 знаков кана"
    direction: UP
- assertVisible: "Изучено 1 / 92 знаков кана"
- takeScreenshot: ui-screenshots/japanese-progress-before-restart
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "日本語 · Учить"
    timeout: 30000
- tapOn: "日本語 · Учить"
- extendedWaitUntil:
    visible: "日本語 · Японский с нуля"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Изучено 1 / 92 знаков кана"
    direction: UP
- assertVisible: "Изучено 1 / 92 знаков кана"
- scrollUntilVisible:
    element:
      id: "Кана あ"
    direction: DOWN
- tapOn:
    id: "Кана あ"
- scrollUntilVisible:
    element:
      text: "✓ Изучено — снять отметку"
    direction: DOWN
- assertVisible: "✓ Изучено — снять отметку"
- takeScreenshot: ui-screenshots/japanese-progress-restored
