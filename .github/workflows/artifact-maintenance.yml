name: Maintain Actions artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/artifact-maintenance.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write
concurrency:
  group: artifact-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inventory and remove only unprotected old build artifacts
        id: clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import collections, datetime as dt, json, os, re, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, paged=False):
              args = ['gh', 'api', path]
              if paged:
                  args += ['--paginate', '--slurp']
              return json.loads(subprocess.check_output(args, text=True))
          root = f'repos/{repo}'
          artifacts = [a for page in api(root+'/actions/artifacts?per_page=100', True) for a in page['artifacts']]
          prs = [p for page in api(root+'/pulls?state=open&per_page=100', True) for p in page]
          open_shas = {p['head']['sha'] for p in prs}
          open_branches = {p['head']['ref'] for p in prs}
          now = dt.datetime.now(dt.timezone.utc)
          def created(a):
              return dt.datetime.fromisoformat(a['created_at'].replace('Z', '+00:00'))
          def category(name):
              n = name.lower()
              if re.search(r'backup|restore|recovery|snapshot|release|stable|production.data|database|keystore|secret|golden|baseline|signing|evidence|acceptance|migration', n):
                  return None
              if re.search(r'(^|[-_.])(?:test-results?|test-reports?|coverage(?:-report)?|lint-report|junit-results?)([-_.]|$)', n):
                  return 'report'
              if re.search(r'(^|[-_.])(?:apk|debug)([-_.]|$)', n):
                  return 'build'
              return None
          def family(a):
              n = a['name'].lower()
              n = re.sub(r'[-_.][0-9a-f]{7,64}$', '', n)
              return re.sub(r'c[0-9]+-[0-9]+', 'stage', n)
          ordered = sorted(artifacts, key=created, reverse=True)
          groups = collections.defaultdict(list)
          for a in ordered:
              if not a.get('expired') and category(a['name']):
                  groups[(category(a['name']),family(a))].append(a)
          runs = {}
          def run_for(a):
              rid = (a.get('workflow_run') or {}).get('id')
              if not rid:
                  return None
              if rid not in runs:
                  runs[rid] = api(f'{root}/actions/runs/{rid}')
              return runs[rid]
          protected = set()
          for (kind, _), group in groups.items():
              keep = 2 if kind == 'build' else 1
              protected.update(a['id'] for a in group[:keep])
              good = [a for a in group if (run_for(a) or {}).get('conclusion') == 'success']
              protected.update(a['id'] for a in good[:keep])
          good_builds = [a for a in ordered if not a.get('expired') and category(a['name']) == 'build' and (run_for(a) or {}).get('conclusion') == 'success']
          protected.update(a['id'] for a in good_builds[:2])
          candidates = []
          reasons = collections.Counter()
          for a in ordered:
              kind = category(a['name'])
              if not kind or a.get('expired') or a['id'] in protected:
                  reasons['protected, unknown or expired'] += 1
                  continue
              if (now-created(a)).total_seconds() < (7 if kind=='build' else 3)*86400:
                  reasons['within retention window'] += 1
                  continue
              run = run_for(a)
              if not run or run.get('status') != 'completed' or not run.get('head_sha') or not run.get('head_branch') or run['head_sha'] in open_shas or run['head_branch'] in open_branches:
                  reasons['open PR or incomplete provenance'] += 1
                  continue
              if (run.get('head_repository') or {}).get('full_name', '').lower() != repo.lower():
                  reasons['external or unknown source'] += 1
                  continue
              candidates.append(a)
          total = sum(a.get('size_in_bytes',0) for a in artifacts if not a.get('expired'))
          deleted = []
          try:
              for a in candidates:
                  subprocess.run(['gh','api','-X','DELETE',f"{root}/actions/artifacts/{a['id']}"],check=True)
                  deleted.append(a)
                  print(json.dumps({'deleted':a['id'],'name':a['name'],'bytes':a.get('size_in_bytes',0)}),flush=True)
          finally:
              freed = sum(a.get('size_in_bytes',0) for a in deleted)
              report = {'inventoried':len(artifacts),'active_bytes_before':total,'deleted':len(deleted),'deleted_bytes':freed,'retained':len(artifacts)-len(deleted),'retention_days':{'build':7,'report':3},'deleted_ids':[a['id'] for a in deleted],'preserved_reasons':dict(reasons)}
              print(json.dumps(report),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Artifact maintenance\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write(f"summary={len(artifacts)} inventoried, {len(deleted)} removed, {freed} bytes freed\n")
          PY
      - name: Record result on maintenance commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.clean.outcome }}
          SUMMARY: ${{ steps.clean.outputs.summary }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="maintenance/artifacts" -f description="${SUMMARY:-See workflow log}" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
