appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Regression: a newly created Kanban task must survive an activity restart.
# This flow starts after the Japanese upgrade test and preserves existing data.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "日本語 · Учить"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "quickAdd"
    timeout: 30000
# Verify the v1 IndexedDB task immediately after installing APK v2.
- scrollUntilVisible:
    element:
      text: "Beta upgrade persistence task"
    direction: DOWN
    timeout: 30000
- assertVisible: "Beta upgrade persistence task"
- tapOn:
    id: "quickAdd"
- inputText: "Beta persistence smoke task"
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- assertVisible: "Beta persistence smoke task"
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      text: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
- assertVisible: "Beta persistence smoke task"
- scrollUntilVisible:
    element:
      text: "Beta upgrade persistence task"
    direction: DOWN
    timeout: 30000
- assertVisible: "Beta upgrade persistence task"
- takeScreenshot: ui-screenshots/kanban-task-persisted
