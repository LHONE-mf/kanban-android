appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# The disposable imported fixture contains two genuine PNG task attachments.
# Open the first one, check zoom controls and navigation, then close the viewer.
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
# Tap the task TITLE, not the centered thumbnail: center opens the photo viewer.
- tapOn:
    id: "Beta persistence smoke task"
    point: "22%, 9%"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
- hideKeyboard
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- assertVisible: "Открыть файл kanban-zoom-a.png"
- tapOn: "Открыть файл kanban-zoom-a.png"
- extendedWaitUntil:
    visible:
      id: "lightboxZoomIn"
    timeout: 30000
- assertVisible: "1 / 2"
- tapOn:
    id: "lightboxZoomIn"
- assertVisible: "150%"
- tapOn:
    id: "lightboxZoomReset"
- assertVisible: "100%"
- tapOn:
    id: "lightboxNext"
- assertVisible: "2 / 2"
- tapOn:
    id: "lightboxClose"
- assertNotVisible:
    id: "lightboxZoomIn"
- takeScreenshot: ui-screenshots/kanban-photo-zoom-close
