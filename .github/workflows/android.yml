name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

# Only the newest build on a branch matters during rapid development.
# Separate groups for push and pull requests avoid cancelling unrelated checks.
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable development signing key
        run: |
          base64 --decode .github/keys/kanban-debug.keystore.b64 > .github/keys/kanban-debug.keystore
          chmod 600 .github/keys/kanban-debug.keystore
          keytool -list -keystore .github/keys/kanban-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Run project regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Japanese progress and review storage failures
        run: |
          node tests/test_japanese_storage.cjs
          node tests/test_japanese_review.cjs
          node tests/test_japanese_quiz.cjs
          node tests/test_japanese_syntax.cjs
          node tests/test_japanese_load.cjs
          node tests/test_japanese_review_load.cjs
          node tests/test_japanese_new_question.cjs
          node tests/test_japanese_writing.cjs
          node tests/test_android_backup.cjs
          node tests/test_android_file_open.cjs
          node tests/test_photo_attachments.cjs
          node tests/test_photo_zoom_gestures.cjs
          node tests/test_notification_navigation.cjs
          node tests/test_android_back_task_save.cjs
          node tests/test_android_back_real_save.cjs
      - name: Verify generated Kanban JavaScript
        run: python3 tools/build_kanban_js.py --check
      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/kanban.js
      - name: Validate emulator runner shell syntax
        run: bash -n .github/scripts/run-emulator-ui.sh
      - name: Compile Kotlin before APK packaging
        env:
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Run executable reminder recurrence unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build development APK
        env:
          KANBAN_VERSION_CODE: ${{ github.run_number }}
          KANBAN_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.github/keys/kanban-debug.keystore
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify development APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -q 'Signer #1 certificate SHA-256 digest'
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=$(keytool -list -v -keystore .github/keys/kanban-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          INFO=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package:")
          echo "$INFO"
          echo "$INFO" | grep -q "name='com.kanban.offline'"
          echo "$INFO" | grep -q "versionCode='${{ github.run_number }}'"
          echo "Verified package, versionCode and persistent signing certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: kanban-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not configured. Only debug APK will be built."
          fi

      - name: Decode release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KANBAN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kanban-release.jks"

      - name: Build permanently signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KANBAN_KEYSTORE_PATH: ${{ runner.temp }}/kanban-release.jks
          KANBAN_STORE_PASSWORD: ${{ secrets.KANBAN_STORE_PASSWORD }}
          KANBAN_KEY_ALIAS: ${{ secrets.KANBAN_KEY_ALIAS }}
          KANBAN_KEY_PASSWORD: ${{ secrets.KANBAN_KEY_PASSWORD }}
          KANBAN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kanban-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/kanban-release.jks" .github/keys/kanban-debug.keystore
      - name: Publish APK result as a commit status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$CURRENT_JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          jq -n \
            --arg state "$STATE" \
            --arg context "android/apk-build" \
            --arg description "Android APK build and regressions: $CURRENT_JOB_STATUS" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > /tmp/kanban-apk-status.json
          if ! curl --fail --silent --show-error --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -X POST \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --data-binary @/tmp/kanban-apk-status.json >/dev/null; then
            echo "::warning::Could not publish APK status; the build result remains in this job's logs."
          fi
