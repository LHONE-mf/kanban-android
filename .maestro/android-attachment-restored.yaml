appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# After importing a real SAF export containing binary media, confirm that the
# task still has its attachment and that the restored file can be opened.
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: "Beta persistence smoke task"
    direction: DOWN
    timeout: 30000
# Tap the task TITLE, not the centered thumbnail: center opens the photo viewer.
- tapOn:
    id: "Beta persistence smoke task"
    point: "22%, 9%"
- extendedWaitUntil:
    visible: "Редактирование задачи"
    timeout: 30000
# A filename is part of a longer file-row label, and a WebView element may
# be clipped by the editor even when it is in the accessibility tree. Swipe
# inside the scrolling body and assert the exact accessible Open control.
- hideKeyboard
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- swipe:
    start: "50%, 62%"
    end: "50%, 28%"
    duration: 470
- assertVisible: "Открыть файл kanban-view-test.txt"
- takeScreenshot: ui-screenshots/kanban-restored-attachment
