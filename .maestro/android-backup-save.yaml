appId: com.kanban.offline
androidWebViewHierarchy: devtools
---
# Exercise the real Android SAF document picker, explicitly choose Downloads,
# then save the JSON backup. The shell runner independently verifies its bytes.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "exportBtn"
    timeout: 30000
- tapOn:
    id: "exportBtn"
- extendedWaitUntil:
    visible: "(?i)^save$"
    timeout: 30000
- takeScreenshot: ui-screenshots/kanban-backup-save-picker
- tapOn: "Show roots"
- extendedWaitUntil:
    visible: "(?i)^Downloads$"
    timeout: 15000
- tapOn: "(?i)^Downloads$"
- extendedWaitUntil:
    visible: "(?i)^save$"
    timeout: 15000
- takeScreenshot: ui-screenshots/kanban-backup-save-downloads
- tapOn: "(?i)^save$"
- extendedWaitUntil:
    visible: "Бэкап сохранён:"
    timeout: 30000
- takeScreenshot: ui-screenshots/kanban-backup-saved
